[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ledger"
version = "0.1.0"
description = "Cryptographic Claim-Evidence Provenance Ledger for Auditable AI Reasoning"
readme = "README.md"
license = "Apache-2.0 OR MIT"
authors = [{ name = "Reuben Bowlby", email = "reuben@hummbl.io" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evidence-ledger = "evidence_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evidence_ledger*"]
exclude = ["assets*", "tests*", "examples*"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
