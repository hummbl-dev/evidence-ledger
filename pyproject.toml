[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ledger"
version = "0.1.0"
description = "Cryptographic Claim-Evidence Provenance Ledger for Auditable AI Reasoning"
readme = "README.md"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "Reuben Bowlby", email = "reuben@hummbl.io" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
evidence-ledger = "evidence_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evidence_ledger*"]
exclude = ["assets*", "tests*", "examples*"]

[project.urls]
Homepage = "https://github.com/hummbl-dev/evidence-ledger"
Repository = "https://github.com/hummbl-dev/evidence-ledger"
Issues = "https://github.com/hummbl-dev/evidence-ledger/issues"
[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
